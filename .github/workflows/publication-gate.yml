name: publication-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publication-gate:
    name: publication-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public conformance dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify EFAD conformance positive and negative fixtures
        run: python tools/conformance.py --spec spec/PGR_CONTRACTS_V0_1.json --fixtures spec/PGR_CONFORMANCE_FIXTURES_V0_1.json --out /tmp/efad_conformance_receipt.json
      - name: Run publication gate (default deny)
        run: python tools/publication_gate.py
      - name: Validate research site markup and key sections
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if "id" in d: self.ids.add(d["id"])
                  if tag == "a" and "href" in d: self.links.append(d["href"])
          doc = Path("docs/index.html").read_text(encoding="utf-8")
          p = Check(); p.feed(doc); p.close()
          assert {"main", "programme", "efad", "publications", "about"} <= p.ids
          assert len(p.links) >= 8
          assert "Rick Sarkar" in doc and "MIT" in doc
          print("STATIC_RESEARCH_SITE_CHECK=PASS")
          PY
